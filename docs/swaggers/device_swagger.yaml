openapi: 3.0.3
info:
  title: Teraid Pay Device API
  version: 1.0.0
  description: 店舗に設置する端末用APIのOpenAPI定義。
servers:
  - url: http://localhost:8005
    description: ローカル開発環境

tags:
  - name: Device
    description: 端末の有効化、認証、来店セッション開始、メニューの参照

paths:
  /device/activate:
    post:
      tags: [Device]
      summary: 端末初回有効化
      description: 一回限りの有効化コードを照合して端末を有効化し、端末UUIDと端末認証情報を返す。
      operationId: activateDevice
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceActivateRequest'
      responses:
        '200':
          description: 端末の有効化に成功
          headers:
            Cache-Control:
              description: 端末認証情報を含むレスポンスのキャッシュ禁止
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceActivateResponse'
        '400':
          description: コードが一致しない、期限切れ、使用済み、または対象端末が削除済み
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                detail:
                  status: error
                  message: 有効化コードを利用できません。
        '422':
          description: リクエストの形式または有効化コードの形式が不正
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '500':
          description: 端末初回有効化処理に失敗
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                detail:
                  status: error
                  message: 予期せぬエラーが発生しました。

  /device/auth/token:
    post:
      tags: [Device]
      summary: 端末アクセストークン発行
      description: 初回有効化時に発行された端末認証情報を照合し、端末用のアクセストークンを返す。
      operationId: issueDeviceAccessToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceAccessTokenRequest'
      responses:
        '200':
          description: 端末の認証とアクセストークン発行に成功
          headers:
            Cache-Control:
              description: アクセストークンを含むレスポンスのキャッシュ禁止
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceAccessTokenResponse'
        '401':
          description: 認証情報が一致しない、または対象端末が利用できない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                detail:
                  status: error
                  message: 端末認証に失敗しました。
        '422':
          description: リクエストの形式または必須項目の値が不正
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '500':
          description: 端末アクセストークン発行処理に失敗
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                detail:
                  status: error
                  message: 予期せぬエラーが発生しました。

  /device/visit-sessions:
    post:
      tags: [Device]
      summary: 来店セッション開始
      description: 認証済み端末の来店セッションを開始する。同じ開始要求のセッションが進行中の場合は既存のIDを返す。
      operationId: startVisitSession
      security:
        - DeviceBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VisitSessionStartRequest'
      responses:
        '200':
          description: 同じ開始要求に対応する進行中のセッションを返した
          headers:
            Cache-Control:
              $ref: '#/components/headers/VisitSessionCacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitSessionStartResponse'
        '201':
          description: 新規セッションを作成した
          headers:
            Cache-Control:
              $ref: '#/components/headers/VisitSessionCacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitSessionStartResponse'
        '401':
          description: 端末アクセストークンが利用できないか、対象端末が利用できない
          headers:
            WWW-Authenticate:
              schema:
                type: string
                example: Bearer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 同じ開始要求に対応するセッションが終了済み、または別のセッションが進行中
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: JSONの形式または開始要求IDの値が不正
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '500':
          description: 来店セッション開始処理に失敗
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /device/menu/categories:
    get:
      tags: [Device]
      summary: メニューカテゴリー一覧取得
      description: 注文受付中の来店セッションに対し、端末の所属店舗の有効・未削除カテゴリーを表示順で返す。
      operationId: getDeviceMenuCategories
      security:
        - DeviceBearerAuth: []
      parameters:
        - name: visit_session_id
          in: query
          required: true
          description: 認証済み端末に紐づく来店セッションID。正の十進整数。
          schema:
            type: integer
            format: int64
            minimum: 1
            maximum: 9223372036854775807
          example: 123
      responses:
        '200':
          description: カテゴリー一覧の取得に成功。該当するカテゴリーがない場合は空配列を返す。
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceMenuCategoryListResponse'
        '401':
          description: 端末アクセストークンが無効か、端末が利用できない
          headers:
            WWW-Authenticate:
              schema:
                type: string
                example: Bearer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 認証済み端末に紐づく注文受付中の来店セッションが見つからない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                detail:
                  status: error
                  message: 来店セッションが見つかりません。
        '422':
          description: 来店セッションIDが未指定、整数形式以外、または範囲外
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '500':
          description: 認証設定の取得、DB処理、または画像URLの生成に失敗
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /device/menu/categories/{menu_category_id}/items:
    get:
      tags: [Device]
      summary: カテゴリー別メニュー取得
      description: 注文受付中の来店セッションに対し、認証済み端末の所属店舗の指定カテゴリーから、販売可能な商品、商品画像URL、選択可能なオプションを表示順で返す。
      operationId: getDeviceMenuItemsByCategory
      security:
        - DeviceBearerAuth: []
      parameters:
        - name: menu_category_id
          in: path
          required: true
          description: 取得対象のメニューカテゴリーID。ASCIIの正の十進整数。
          schema:
            type: integer
            format: int64
            minimum: 1
            maximum: 9223372036854775807
          example: 1
        - name: visit_session_id
          in: query
          required: true
          description: 認証済み端末に紐づく来店セッションID。ASCIIの正の十進整数。
          schema:
            type: integer
            format: int64
            minimum: 1
            maximum: 9223372036854775807
          example: 123
      responses:
        '200':
          description: 一覧の取得に成功。カテゴリーに販売可能な商品がなければ空配列を返す。
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceMenuItemListResponse'
              examples:
                available:
                  summary: 商品とオプションを取得
                  value:
                    menu_items:
                      - menu_item_id: 10
                        name: チーズバーガー
                        price: '600.000000'
                        token_symbol: JPYC
                        image_url: https://example.com/menus/101/10.jpeg?signature=...
                        display_order: 1
                        option_groups:
                          - menu_option_group_id: 20
                            name: トッピング
                            min_selections: 0
                            max_selections: 1
                            display_order: 1
                            options:
                              - menu_option_id: 30
                                name: チーズ追加
                                additional_price: '100.000000'
                                display_order: 1
                empty:
                  summary: 販売可能な商品なし
                  value:
                    menu_items: []
        '401':
          description: 端末アクセストークンが未指定・無効、または端末が利用できない
          headers:
            WWW-Authenticate:
              schema:
                type: string
                example: Bearer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 認証済み端末に紐づく注文受付中の来店セッション、または所属店舗の有効・未削除カテゴリーが見つからない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                visitSessionNotFound:
                  value:
                    detail:
                      status: error
                      message: 来店セッションが見つかりません。
                menuCategoryNotFound:
                  value:
                    detail:
                      status: error
                      message: メニューカテゴリーが存在しません。
        '422':
          description: 必須クエリが未指定、またはIDが整数形式以外・範囲外
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '500':
          description: 認証設定の取得、DB処理、または商品画像の設定取得・URL生成に失敗
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    DeviceBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  headers:
    VisitSessionCacheControl:
      description: 来店セッションの成功レスポンスのキャッシュ禁止
      schema:
        type: string
        example: no-store
  schemas:
    DeviceActivateRequest:
      type: object
      required: [activation_code]
      properties:
        activation_code:
          type: string
          pattern: '^[ABCDEFGHJKLMNPQRSTUVWXYZ23456789]{4}-[ABCDEFGHJKLMNPQRSTUVWXYZ23456789]{4}-[ABCDEFGHJKLMNPQRSTUVWXYZ23456789]{4}$'
          example: ABCD-EFGH-JKLM
    DeviceActivateResponse:
      type: object
      required: [device_uuid, device_credential]
      properties:
        device_uuid:
          type: string
          format: uuid
          example: 3ef42a83-9fc8-4418-ac59-148328719672
        device_credential:
          type: string
          description: 初回有効化時に一度だけ返す端末認証情報。
          example: EXAMPLE_DEVICE_CREDENTIAL
    DeviceAccessTokenRequest:
      type: object
      required: [device_uuid, device_credential]
      properties:
        device_uuid:
          type: string
          format: uuid
          example: 3ef42a83-9fc8-4418-ac59-148328719672
        device_credential:
          type: string
          minLength: 1
          description: 初回有効化時に返される端末認証情報。
          example: EXAMPLE_DEVICE_CREDENTIAL
    DeviceAccessTokenResponse:
      type: object
      required: [access_token, token_type, expires_in]
      properties:
        access_token:
          type: string
          description: 端末に紐づくJWTアクセストークン。
          example: EXAMPLE_ACCESS_TOKEN
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          minimum: 1
          description: アクセストークンの有効期間（秒）。
          example: 300
    VisitSessionStartRequest:
      type: object
      required: [start_request_id]
      properties:
        start_request_id:
          type: string
          minLength: 1
          maxLength: 64
          description: 開始操作ごとに端末で生成し、同じ操作の再送では同じ値を使用する。空白のみの値は不可。
          example: b93c8a2b-5464-47b2-b87d-e36e7f2a64e4
    VisitSessionStartResponse:
      type: object
      required: [visit_session_id]
      properties:
        visit_session_id:
          type: integer
          format: int64
          description: 新規または既存の来店セッションID
          example: 123
    DeviceMenuCategoryListResponse:
      type: object
      required: [menu_categories]
      properties:
        menu_categories:
          type: array
          description: display_order、menu_category_id の昇順のカテゴリー一覧。
          items:
            $ref: '#/components/schemas/DeviceMenuCategory'
    DeviceMenuCategory:
      type: object
      required: [menu_category_id, name, image_url, display_order]
      properties:
        menu_category_id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: ハンバーガー
        image_url:
          type: string
          format: uri
          description: カテゴリー画像取得用の署名付きURL。
        display_order:
          type: integer
          example: 1
    DeviceMenuItemListResponse:
      type: object
      required: [menu_items]
      properties:
        menu_items:
          type: array
          description: 販売可能な商品の一覧。表示順と商品IDの昇順。
          items:
            $ref: '#/components/schemas/DeviceMenuItemResponse'
    DeviceMenuItemResponse:
      type: object
      required: [menu_item_id, name, price, token_symbol, image_url, display_order, option_groups]
      properties:
        menu_item_id:
          type: integer
          format: int64
          minimum: 1
          description: 商品ID。
        name:
          type: string
          description: 商品名。
        price:
          type: string
          pattern: '^\d{1,14}\.\d{6}$'
          description: 小数点以下6桁で表した基本価格。
        token_symbol:
          type: string
          description: 価格のトークンシンボル。
        image_url:
          type: string
          format: uri
          description: S3の商品画像を取得する署名付きGET URL。
        display_order:
          type: integer
          minimum: 0
          description: 表示順。
        option_groups:
          type: array
          description: 有効かつ未削除のグループを表示順とグループIDの昇順で返す。
          items:
            $ref: '#/components/schemas/DeviceMenuOptionGroupResponse'
    DeviceMenuOptionGroupResponse:
      type: object
      required: [menu_option_group_id, name, min_selections, max_selections, display_order, options]
      properties:
        menu_option_group_id:
          type: integer
          format: int64
          minimum: 1
          description: オプショングループID。
        name:
          type: string
          description: グループ名。
        min_selections:
          type: integer
          minimum: 0
          description: 最小選択数。選択可能なオプション数以下。
        max_selections:
          type: integer
          minimum: 1
          description: 最大選択数。
        display_order:
          type: integer
          minimum: 0
          description: 表示順。
        options:
          type: array
          description: 選択可能かつ未削除のオプションを表示順とオプションIDの昇順で返す。
          items:
            $ref: '#/components/schemas/DeviceMenuOptionResponse'
    DeviceMenuOptionResponse:
      type: object
      required: [menu_option_id, name, additional_price, display_order]
      properties:
        menu_option_id:
          type: integer
          format: int64
          minimum: 1
          description: オプションID。
        name:
          type: string
          description: オプション名。
        additional_price:
          type: string
          pattern: '^\d{1,14}\.\d{6}$'
          description: 小数点以下6桁で表した追加料金。
        display_order:
          type: integer
          minimum: 0
          description: 表示順。
    ErrorResponse:
      type: object
      required: [detail]
      properties:
        detail:
          type: object
          required: [status, message]
          properties:
            status:
              type: string
              enum: [error]
            message:
              type: string
    ValidationErrorResponse:
      type: object
      required: [detail]
      properties:
        detail:
          type: array
          items:
            type: object
            required: [loc, type, msg]
            properties:
              loc:
                type: array
                items:
                  oneOf:
                    - type: string
                    - type: integer
              type:
                type: string
              msg:
                type: string
