openapi: 3.0.3
info:
  title: Teraid Pay Device API
  version: 1.0.0
  description: 店舗に設置する端末用APIのOpenAPI定義。
servers:
  - url: http://localhost:8005
    description: ローカル開発環境

tags:
  - name: Device
    description: 端末の有効化、認証、来店セッション開始、メニュー参照、注文登録・履歴取得

paths:
  /device/activate:
    post:
      tags: [Device]
      summary: 端末初回有効化
      description: 一回限りの有効化コードを照合して端末を有効化し、端末UUIDと端末認証情報を返す。
      operationId: activateDevice
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceActivateRequest'
      responses:
        '200':
          description: 端末の有効化に成功
          headers:
            Cache-Control:
              description: 端末認証情報を含むレスポンスのキャッシュ禁止
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceActivateResponse'
        '400':
          description: コードが一致しない、期限切れ、使用済み、または対象端末が削除済み
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                detail:
                  status: error
                  message: 有効化コードを利用できません。
        '422':
          description: リクエストの形式または有効化コードの形式が不正
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '500':
          description: 端末初回有効化処理に失敗
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                detail:
                  status: error
                  message: 予期せぬエラーが発生しました。

  /device/auth/token:
    post:
      tags: [Device]
      summary: 端末アクセストークン発行
      description: 初回有効化時に発行された端末認証情報を照合し、端末用のアクセストークンを返す。
      operationId: issueDeviceAccessToken
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceAccessTokenRequest'
      responses:
        '200':
          description: 端末の認証とアクセストークン発行に成功
          headers:
            Cache-Control:
              description: アクセストークンを含むレスポンスのキャッシュ禁止
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceAccessTokenResponse'
        '401':
          description: 認証情報が一致しない、または対象端末が利用できない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                detail:
                  status: error
                  message: 端末認証に失敗しました。
        '422':
          description: リクエストの形式または必須項目の値が不正
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '500':
          description: 端末アクセストークン発行処理に失敗
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                detail:
                  status: error
                  message: 予期せぬエラーが発生しました。

  /device/visit-sessions:
    post:
      tags: [Device]
      summary: 来店セッション開始
      description: 認証済み端末の来店セッションを開始する。同じ開始要求のセッションが進行中の場合は既存のIDを返す。
      operationId: startVisitSession
      security:
        - DeviceBearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VisitSessionStartRequest'
      responses:
        '200':
          description: 同じ開始要求に対応する進行中のセッションを返した
          headers:
            Cache-Control:
              $ref: '#/components/headers/VisitSessionCacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitSessionStartResponse'
        '201':
          description: 新規セッションを作成した
          headers:
            Cache-Control:
              $ref: '#/components/headers/VisitSessionCacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VisitSessionStartResponse'
        '401':
          description: 端末アクセストークンが利用できないか、対象端末が利用できない
          headers:
            WWW-Authenticate:
              schema:
                type: string
                example: Bearer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 同じ開始要求に対応するセッションが終了済み、または別のセッションが進行中
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: JSONの形式または開始要求IDの値が不正
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '500':
          description: 来店セッション開始処理に失敗
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /device/visit-sessions/{visit_session_id}/orders:
    post:
      tags: [Device]
      summary: 注文登録
      description: >-
        認証済み端末の来店セッションに未払いの注文を登録する。
        1件の注文に使うトークンは1種類とし、グループの選択数にはオプション数量の合計を使う。
        同じ注文の再送には保存済みの金額を返す。
      operationId: createDeviceOrder
      security:
        - DeviceBearerAuth: []
      parameters:
        - name: visit_session_id
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
            maximum: 9223372036854775807
        - name: Idempotency-Key
          in: header
          required: true
          description: 全注文で一意のキー。同じ注文を再送するときは同じキーを使用する。
          schema:
            type: string
            minLength: 1
            maxLength: 64
            pattern: '\S'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceOrderCreateRequest'
      responses:
        '200':
          description: 同じ店舗・来店セッション・内容の登録済み注文を返した
          headers:
            Cache-Control:
              $ref: '#/components/headers/VisitSessionCacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceOrderCreateResponse'
        '201':
          description: 未払いの注文を登録した
          headers:
            Cache-Control:
              $ref: '#/components/headers/VisitSessionCacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceOrderCreateResponse'
        '401':
          description: トークンまたは端末が利用できない
          headers:
            WWW-Authenticate:
              schema:
                type: string
                example: Bearer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 端末自身の注文受付中の来店セッションが見つからない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 同じキーで店舗・来店セッション・注文内容の異なる注文が登録済み
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: 入力の形式・範囲、または注文内容が不正
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ValidationErrorResponse'
                  - $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: 認証設定の取得、DB処理、またはトランザクションの確定に失敗
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    get:
      tags: [Device]
      summary: デバイス側注文履歴取得
      description: >-
        認証済み端末自身の注文受付中または決済処理中の来店セッションについて、注文と保存済み明細を返す。
        注文状態は取得時点の値を返す。
      operationId: getDeviceOrderHistory
      security:
        - DeviceBearerAuth: []
      parameters:
        - name: visit_session_id
          in: path
          required: true
          description: ASCIIの正の十進整数。
          schema:
            type: integer
            format: int64
            minimum: 1
            maximum: 9223372036854775807
      responses:
        '200':
          description: 注文履歴を取得した。注文がない場合は orders が空配列。
          headers:
            Cache-Control:
              $ref: '#/components/headers/VisitSessionCacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceOrderHistoryResponse'
        '401':
          description: トークンまたは端末が利用できない
          headers:
            WWW-Authenticate:
              schema:
                type: string
                example: Bearer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 端末自身の注文受付中または決済処理中の来店セッションが見つからない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: 来店セッションIDの形式または範囲が不正
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '500':
          description: 認証設定の取得、DB処理、またはトランザクションの確定に失敗
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /device/visit-sessions/{visit_session_id}/checkouts:
    post:
      tags: [Device]
      summary: 会計作成
      description: >-
        認証済み端末の受付中の来店セッションについて、未払い注文の全件または指定した1件を
        確認待ちの会計として登録し、保存済みの明細と合計金額を返す。
      operationId: createDeviceCheckout
      security:
        - DeviceBearerAuth: []
      parameters:
        - name: visit_session_id
          in: path
          required: true
          description: ASCIIの正の十進整数。
          schema:
            type: integer
            format: int64
            minimum: 1
            maximum: 9223372036854775807
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceCheckoutCreateRequest'
            examples:
              allUnpaid:
                value: {scope: all_unpaid}
              singleOrder:
                value: {scope: single_order, menu_order_id: 456}
      responses:
        '201':
          description: 確認待ちの会計と対象注文を登録した
          headers:
            Cache-Control:
              $ref: '#/components/headers/VisitSessionCacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceCheckoutCreateResponse'
        '401':
          description: トークンまたは端末が利用できない
          headers:
            WWW-Authenticate:
              schema:
                type: string
                example: Bearer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 端末自身の進行中の来店セッション、または個別会計の指定注文が見つからない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: セッションは決済処理中、対象の未払い注文がない、または対象注文の通貨が一致しない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: 来店セッションID、JSON、会計範囲または注文IDの指定が不正
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '500':
          description: 認証設定の取得、DB処理、またはトランザクションの確定に失敗
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /device/checkouts/{checkout_id}/payments/face:
    post:
      tags: [Device]
      summary: 顔認証決済開始
      description: 顔照合で特定した支払者から、会計に保存された注文の代金を送金する。
      operationId: startDeviceFacePayment
      security:
        - DeviceBearerAuth: []
      parameters:
        - name: checkout_id
          in: path
          required: true
          description: ASCIIの正の十進整数。
          schema:
            type: integer
            format: int64
            minimum: 1
            maximum: 9223372036854775807
        - name: Idempotency-Key
          in: header
          required: true
          description: 同じ会計で同じ支払い要求を再送するときに使うキー。
          schema:
            type: string
            minLength: 1
            maxLength: 64
            pattern: '\S'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceFacePaymentRequest'
      responses:
        '200':
          description: 同じキーに紐づく試行、または同じ会計で処理中の試行を返した
          headers:
            Cache-Control:
              $ref: '#/components/headers/VisitSessionCacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceFacePaymentResponse'
        '201':
          description: 新しい試行のRPC送信受付を記録した
          headers:
            Cache-Control:
              $ref: '#/components/headers/VisitSessionCacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceFacePaymentResponse'
        '202':
          description: 試行を登録し、RPCの送信受付の有無を確認中
          headers:
            Cache-Control:
              $ref: '#/components/headers/VisitSessionCacheControl'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceFacePaymentResponse'
        '400':
          description: 顔を検出できない、顔が複数、ウォレットが決済条件を満たさない、または残高不足
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: トークンまたは端末が利用できない
          headers:
            WWW-Authenticate:
              schema:
                type: string
                example: Bearer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 端末の会計、顔の照合先、利用者、またはウォレットが見つからない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 会計内容が変わった、または会計と来店セッションの状態が決済開始を許可しない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: 会計ID、冪等性キー、JSONまたは顔画像が不正
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '500':
          description: 認証設定、顔照合、DBまたは送信前の準備に失敗
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /device/menu/categories:
    get:
      tags: [Device]
      summary: メニューカテゴリー一覧取得
      description: 注文受付中の来店セッションに対し、端末の所属店舗の有効・未削除カテゴリーを表示順で返す。
      operationId: getDeviceMenuCategories
      security:
        - DeviceBearerAuth: []
      parameters:
        - name: visit_session_id
          in: query
          required: true
          description: 認証済み端末に紐づく来店セッションID。正の十進整数。
          schema:
            type: integer
            format: int64
            minimum: 1
            maximum: 9223372036854775807
          example: 123
      responses:
        '200':
          description: カテゴリー一覧の取得に成功。該当するカテゴリーがない場合は空配列を返す。
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceMenuCategoryListResponse'
        '401':
          description: 端末アクセストークンが無効か、端末が利用できない
          headers:
            WWW-Authenticate:
              schema:
                type: string
                example: Bearer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 認証済み端末に紐づく注文受付中の来店セッションが見つからない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                detail:
                  status: error
                  message: 来店セッションが見つかりません。
        '422':
          description: 来店セッションIDが未指定、整数形式以外、または範囲外
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '500':
          description: 認証設定の取得、DB処理、または画像URLの生成に失敗
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /device/menu/categories/{menu_category_id}/items:
    get:
      tags: [Device]
      summary: カテゴリー別メニュー取得
      description: 注文受付中の来店セッションに対し、認証済み端末の所属店舗の指定カテゴリーから、販売可能な商品、商品画像URL、選択可能なオプションを表示順で返す。
      operationId: getDeviceMenuItemsByCategory
      security:
        - DeviceBearerAuth: []
      parameters:
        - name: menu_category_id
          in: path
          required: true
          description: 取得対象のメニューカテゴリーID。ASCIIの正の十進整数。
          schema:
            type: integer
            format: int64
            minimum: 1
            maximum: 9223372036854775807
          example: 1
        - name: visit_session_id
          in: query
          required: true
          description: 認証済み端末に紐づく来店セッションID。ASCIIの正の十進整数。
          schema:
            type: integer
            format: int64
            minimum: 1
            maximum: 9223372036854775807
          example: 123
      responses:
        '200':
          description: 一覧の取得に成功。カテゴリーに販売可能な商品がなければ空配列を返す。
          headers:
            Cache-Control:
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceMenuItemListResponse'
              examples:
                available:
                  summary: 商品とオプションを取得
                  value:
                    menu_items:
                      - menu_item_id: 10
                        name: チーズバーガー
                        price: '600.000000'
                        token_symbol: JPYC
                        image_url: https://example.com/menus/101/10.jpeg?signature=...
                        display_order: 1
                        option_groups:
                          - menu_option_group_id: 20
                            name: トッピング
                            min_selections: 0
                            max_selections: 1
                            display_order: 1
                            options:
                              - menu_option_id: 30
                                name: チーズ追加
                                additional_price: '100.000000'
                                display_order: 1
                empty:
                  summary: 販売可能な商品なし
                  value:
                    menu_items: []
        '401':
          description: 端末アクセストークンが未指定・無効、または端末が利用できない
          headers:
            WWW-Authenticate:
              schema:
                type: string
                example: Bearer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: 認証済み端末に紐づく注文受付中の来店セッション、または所属店舗の有効・未削除カテゴリーが見つからない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              examples:
                visitSessionNotFound:
                  value:
                    detail:
                      status: error
                      message: 来店セッションが見つかりません。
                menuCategoryNotFound:
                  value:
                    detail:
                      status: error
                      message: メニューカテゴリーが存在しません。
        '422':
          description: 必須クエリが未指定、またはIDが整数形式以外・範囲外
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '500':
          description: 認証設定の取得、DB処理、または商品画像の設定取得・URL生成に失敗
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    DeviceBearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  headers:
    VisitSessionCacheControl:
      description: 来店セッションの成功レスポンスのキャッシュ禁止
      schema:
        type: string
        example: no-store
  schemas:
    DeviceActivateRequest:
      type: object
      required: [activation_code]
      properties:
        activation_code:
          type: string
          pattern: '^[ABCDEFGHJKLMNPQRSTUVWXYZ23456789]{4}-[ABCDEFGHJKLMNPQRSTUVWXYZ23456789]{4}-[ABCDEFGHJKLMNPQRSTUVWXYZ23456789]{4}$'
          example: ABCD-EFGH-JKLM
    DeviceActivateResponse:
      type: object
      required: [device_uuid, device_credential]
      properties:
        device_uuid:
          type: string
          format: uuid
          example: 3ef42a83-9fc8-4418-ac59-148328719672
        device_credential:
          type: string
          description: 初回有効化時に一度だけ返す端末認証情報。
          example: EXAMPLE_DEVICE_CREDENTIAL
    DeviceAccessTokenRequest:
      type: object
      required: [device_uuid, device_credential]
      properties:
        device_uuid:
          type: string
          format: uuid
          example: 3ef42a83-9fc8-4418-ac59-148328719672
        device_credential:
          type: string
          minLength: 1
          description: 初回有効化時に返される端末認証情報。
          example: EXAMPLE_DEVICE_CREDENTIAL
    DeviceAccessTokenResponse:
      type: object
      required: [access_token, token_type, expires_in]
      properties:
        access_token:
          type: string
          description: 端末に紐づくJWTアクセストークン。
          example: EXAMPLE_ACCESS_TOKEN
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          minimum: 1
          description: アクセストークンの有効期間（秒）。
          example: 300
    VisitSessionStartRequest:
      type: object
      required: [start_request_id]
      properties:
        start_request_id:
          type: string
          minLength: 1
          maxLength: 64
          description: 開始操作ごとに端末で生成し、同じ操作の再送では同じ値を使用する。空白のみの値は不可。
          example: b93c8a2b-5464-47b2-b87d-e36e7f2a64e4
    VisitSessionStartResponse:
      type: object
      required: [visit_session_id]
      properties:
        visit_session_id:
          type: integer
          format: int64
          description: 新規または既存の来店セッションID
          example: 123
    DeviceOrderCreateRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          items:
            type: object
            required: [menu_item_id, quantity, options]
            properties:
              menu_item_id:
                type: integer
                format: int64
                minimum: 1
                maximum: 9223372036854775807
              quantity:
                type: integer
                minimum: 1
                maximum: 4294967295
              options:
                type: array
                description: 商品1個当たりの選択内容。選択しない場合は空配列。
                items:
                  type: object
                  required: [menu_option_id, option_quantity]
                  properties:
                    menu_option_id:
                      type: integer
                      format: int64
                      minimum: 1
                      maximum: 9223372036854775807
                    option_quantity:
                      type: integer
                      minimum: 1
                      maximum: 4294967295

    DeviceOrderCreateResponse:
      type: object
      required: [menu_order_id, total_amount, token_symbol]
      properties:
        menu_order_id:
          type: integer
          format: int64
          example: 456
        total_amount:
          type: string
          description: 小数点以下6桁の合計金額。
          example: '1400.000000'
        token_symbol:
          type: string
          example: JPYC

    DeviceCheckoutCreateRequest:
      oneOf:
        - $ref: '#/components/schemas/AllUnpaidCheckoutRequest'
        - $ref: '#/components/schemas/SingleOrderCheckoutRequest'
      discriminator:
        propertyName: scope
        mapping:
          all_unpaid: '#/components/schemas/AllUnpaidCheckoutRequest'
          single_order: '#/components/schemas/SingleOrderCheckoutRequest'
    AllUnpaidCheckoutRequest:
      type: object
      additionalProperties: false
      required: [scope]
      properties:
        scope:
          type: string
          enum: [all_unpaid]
    SingleOrderCheckoutRequest:
      type: object
      additionalProperties: false
      required: [scope, menu_order_id]
      properties:
        scope:
          type: string
          enum: [single_order]
        menu_order_id:
          type: integer
          format: int64
          minimum: 1
          maximum: 9223372036854775807
          example: 456
    DeviceFacePaymentRequest:
      type: object
      required: [content]
      additionalProperties: false
      properties:
        content:
          type: string
          format: byte
          minLength: 1
          maxLength: 5000
          description: JPEGまたはPNGのBase64文字列。画像の縦横は各2048ピクセル以内。
    DeviceFacePaymentResponse:
      type: object
      required: [payment_request_id, status]
      properties:
        payment_request_id:
          type: integer
          format: int64
          example: 901
        status:
          type: string
          enum: [requested, submitted, confirming, paid, tx_failed, verify_failed, canceled, error]
          example: submitted
    DeviceCheckoutCreateResponse:
      type: object
      required: [checkout_id, orders, total_amount, token_symbol]
      properties:
        checkout_id:
          type: integer
          format: int64
          example: 789
        orders:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/DeviceCheckoutOrderResponse'
        total_amount:
          type: string
          description: 小数点以下6桁の会計合計金額。
          example: '1400.000000'
        token_symbol:
          type: string
          example: JPYC
    DeviceCheckoutOrderResponse:
      type: object
      required: [menu_order_id, total_amount, items]
      properties:
        menu_order_id:
          type: integer
          format: int64
          example: 456
        total_amount:
          type: string
          description: 小数点以下6桁の保存済み注文合計金額。
          example: '1400.000000'
        items:
          type: array
          items:
            $ref: '#/components/schemas/DeviceOrderHistoryItemResponse'

    DeviceOrderHistoryResponse:
      type: object
      required: [orders]
      properties:
        orders:
          type: array
          description: 受付日時、同時刻の場合は注文IDの降順。
          items:
            $ref: '#/components/schemas/DeviceOrderHistoryEntryResponse'
    DeviceOrderHistoryEntryResponse:
      type: object
      required: [menu_order_id, created_at, status, total_amount, token_symbol, items]
      properties:
        menu_order_id:
          type: integer
          format: int64
          example: 456
        created_at:
          type: string
          format: date-time
          description: UTCの注文受付日時。
          example: '2026-11-21T03:00:00Z'
        status:
          type: integer
          enum: [1, 2, 3, 4, 5]
          description: 1は未払い、2は決済処理中、3は支払済み、4は決済失敗、5はキャンセル。
          example: 1
        total_amount:
          type: string
          description: 小数点以下6桁の注文合計金額。
          example: '1400.000000'
        token_symbol:
          type: string
          example: JPYC
        items:
          type: array
          items:
            $ref: '#/components/schemas/DeviceOrderHistoryItemResponse'
    DeviceOrderHistoryItemResponse:
      type: object
      required: [menu_item_name, unit_price, quantity, line_amount, options]
      properties:
        menu_item_name:
          type: string
          example: チーズバーガー
        unit_price:
          type: string
          description: 小数点以下6桁の基本単価。
          example: '600.000000'
        quantity:
          type: integer
          example: 2
        line_amount:
          type: string
          description: オプション料金と商品数量を反映した小数点以下6桁の明細金額。
          example: '1400.000000'
        options:
          type: array
          items:
            $ref: '#/components/schemas/DeviceOrderHistoryOptionResponse'
    DeviceOrderHistoryOptionResponse:
      type: object
      required: [option_group_name, option_name, additional_price, option_quantity]
      properties:
        option_group_name:
          type: string
          example: トッピング
        option_name:
          type: string
          example: チーズ追加
        additional_price:
          type: string
          description: 小数点以下6桁のオプション追加単価。
          example: '100.000000'
        option_quantity:
          type: integer
          description: 商品1個当たりの数量。
          example: 1

    DeviceMenuCategoryListResponse:
      type: object
      required: [menu_categories]
      properties:
        menu_categories:
          type: array
          description: display_order、menu_category_id の昇順のカテゴリー一覧。
          items:
            $ref: '#/components/schemas/DeviceMenuCategory'
    DeviceMenuCategory:
      type: object
      required: [menu_category_id, name, image_url, display_order]
      properties:
        menu_category_id:
          type: integer
          format: int64
          example: 1
        name:
          type: string
          example: ハンバーガー
        image_url:
          type: string
          format: uri
          description: カテゴリー画像取得用の署名付きURL。
        display_order:
          type: integer
          example: 1
    DeviceMenuItemListResponse:
      type: object
      required: [menu_items]
      properties:
        menu_items:
          type: array
          description: 販売可能な商品の一覧。表示順と商品IDの昇順。
          items:
            $ref: '#/components/schemas/DeviceMenuItemResponse'
    DeviceMenuItemResponse:
      type: object
      required: [menu_item_id, name, price, token_symbol, image_url, display_order, option_groups]
      properties:
        menu_item_id:
          type: integer
          format: int64
          minimum: 1
          description: 商品ID。
        name:
          type: string
          description: 商品名。
        price:
          type: string
          pattern: '^\d{1,14}\.\d{6}$'
          description: 小数点以下6桁で表した基本価格。
        token_symbol:
          type: string
          description: 価格のトークンシンボル。
        image_url:
          type: string
          format: uri
          description: S3の商品画像を取得する署名付きGET URL。
        display_order:
          type: integer
          minimum: 0
          description: 表示順。
        option_groups:
          type: array
          description: 有効かつ未削除のグループを表示順とグループIDの昇順で返す。
          items:
            $ref: '#/components/schemas/DeviceMenuOptionGroupResponse'
    DeviceMenuOptionGroupResponse:
      type: object
      required: [menu_option_group_id, name, min_selections, max_selections, display_order, options]
      properties:
        menu_option_group_id:
          type: integer
          format: int64
          minimum: 1
          description: オプショングループID。
        name:
          type: string
          description: グループ名。
        min_selections:
          type: integer
          minimum: 0
          description: 最小選択数。選択可能なオプション数以下。
        max_selections:
          type: integer
          minimum: 1
          description: 最大選択数。
        display_order:
          type: integer
          minimum: 0
          description: 表示順。
        options:
          type: array
          description: 選択可能かつ未削除のオプションを表示順とオプションIDの昇順で返す。
          items:
            $ref: '#/components/schemas/DeviceMenuOptionResponse'
    DeviceMenuOptionResponse:
      type: object
      required: [menu_option_id, name, additional_price, display_order]
      properties:
        menu_option_id:
          type: integer
          format: int64
          minimum: 1
          description: オプションID。
        name:
          type: string
          description: オプション名。
        additional_price:
          type: string
          pattern: '^\d{1,14}\.\d{6}$'
          description: 小数点以下6桁で表した追加料金。
        display_order:
          type: integer
          minimum: 0
          description: 表示順。
    ErrorResponse:
      type: object
      required: [detail]
      properties:
        detail:
          type: object
          required: [status, message]
          properties:
            status:
              type: string
              enum: [error]
            message:
              type: string
    ValidationErrorResponse:
      type: object
      required: [detail]
      properties:
        detail:
          type: array
          items:
            type: object
            required: [loc, type, msg]
            properties:
              loc:
                type: array
                items:
                  oneOf:
                    - type: string
                    - type: integer
              type:
                type: string
              msg:
                type: string
