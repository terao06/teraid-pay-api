openapi: 3.0.3
info:
  title: Teraid Pay Store API
  version: 1.1.0
  description: 店舗管理者のログインおよび店舗ウォレット管理APIのOpenAPI定義。
servers:
  - url: http://localhost:8005
    description: Dockerローカル開発環境

tags:
  - name: StoreManager
    description: 店舗管理者認証
  - name: StoreWallet
    description: 店舗ウォレット管理

paths:
  /store/manager/login:
    post:
      tags: [StoreManager]
      summary: 店舗管理者ログイン
      description: メールアドレスとパスワードを検証し、店舗管理者用JWTを発行する。
      operationId: loginStoreManager
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreManagerLoginRequest'
            example:
              email: api-manager@example.com
              password: password123
      responses:
        '200':
          description: ログイン成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreManagerLoginWrappedResponse'
              example:
                status: success
                data:
                  access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  token_type: Bearer
                  expires_in: 3600
                  store_manager:
                    store_manager_id: 9001
                    store_id: 9001
                    name: API Demo Store Manager
                    roll_id: 1
        '401':
          $ref: '#/components/responses/LoginUnauthorized'
        '403':
          $ref: '#/components/responses/ManagerInactive'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'

  /store/wallet:
    get:
      tags: [StoreWallet]
      summary: 店舗ウォレット取得
      description: JWTで認証した店舗管理者のstore_idを使用して店舗ウォレットを取得する。
      operationId: getStoreWallet
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 取得成功。ウォレット未登録の場合はdataがnullになる。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetWalletWrappedResponse'
              examples:
                found:
                  summary: ウォレット登録済み
                  value:
                    status: success
                    data:
                      wallet_id: 9001
                      wallet_address: '0x9001000000000000000000000000000000000001'
                      chain_type: ethereum
                      network_name: sepolia
                      token_symbol: JPYC
                      chain_id: 11155111
                      is_active: true
                      is_permitted: true
                      verified_at: '2026-11-14 12:00'
                      created_at: '2026-11-14 12:00'
                      updated_at: '2026-11-14 12:00'
                notRegistered:
                  summary: ウォレット未登録
                  value:
                    status: success
                    data: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

    post:
      tags: [StoreWallet]
      summary: 店舗ウォレット認証・登録
      description: 発行済みnonceの署名を検証し、JWTで認証した店舗へウォレットを登録する。
      operationId: verifyAndCreateStoreWallet
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WalletVerifyRequest'
            example:
              wallet_address: '0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266'
              signature: '0x署名値'
              chain_type: ethereum
              network_name: sepolia
              token_symbol: JPYC
              chain_id: 11155111
      responses:
        '200':
          description: ウォレット登録成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreWalletVerifyWrappedResponse'
        '401':
          description: JWTまたはウォレット署名の認証失敗
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: JWTに紐づく店舗が存在しない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 対象店舗に同一チェーンのウォレットが登録済み
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'

  /store/wallet/nonce:
    post:
      tags: [StoreWallet]
      summary: ウォレット認証用nonce発行
      description: JWTで認証した店舗向けに、ウォレット署名で使用するnonceを発行する。
      operationId: createStoreWalletNonce
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WalletNonceCreateRequest'
            example:
              wallet_address: '0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266'
              chain_type: ethereum
              network_name: sepolia
      responses:
        '200':
          description: nonce発行成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletNonceCreateWrappedResponse'
              example:
                status: success
                data:
                  nonce: generated-nonce
                  expires_at: '2026-11-14 12:10'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: 店舗が存在しない、またはウォレットアドレスが使用済み
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'

  /store/wallet/{wallet_id}:
    delete:
      tags: [StoreWallet]
      summary: 店舗ウォレット削除
      description: JWTで認証した店舗に紐づくウォレットを論理削除する。
      operationId: deleteStoreWallet
      security:
        - BearerAuth: []
      parameters:
        - name: wallet_id
          in: path
          required: true
          description: 削除対象のウォレットID
          schema:
            type: integer
          example: 9001
      responses:
        '200':
          description: ウォレット削除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteWalletWrappedResponse'
              example:
                status: success
                data: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: 認証店舗に紐づくウォレットが存在しない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 店舗管理者ログインAPIで発行されたJWT。

  responses:
    LoginUnauthorized:
      description: メールアドレスまたはパスワードが不正
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ManagerInactive:
      description: 店舗管理者アカウントが利用不可
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: JWTが未指定、不正、または期限切れ
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: リクエスト形式不正
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'
    ServerError:
      description: サーバーエラー
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    StoreManagerLoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          minLength: 3
          maxLength: 255
          description: 店舗管理者のメールアドレス
          example: api-manager@example.com
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
          description: 店舗管理者のパスワード
          example: password123

    StoreManagerInfo:
      type: object
      required: [store_manager_id, store_id, name, roll_id]
      properties:
        store_manager_id:
          type: integer
          description: 店舗管理者ID
        store_id:
          type: integer
          description: 所属店舗ID
        name:
          type: string
          description: 店舗管理者名
        roll_id:
          type: integer
          description: ロールID

    StoreManagerLogin:
      type: object
      required: [access_token, token_type, expires_in, store_manager]
      properties:
        access_token:
          type: string
          description: JWTアクセストークン
        token_type:
          type: string
          enum: [Bearer]
        expires_in:
          type: integer
          description: アクセストークンの有効期間（秒）
        store_manager:
          $ref: '#/components/schemas/StoreManagerInfo'

    WalletNonceCreateRequest:
      type: object
      required: [wallet_address]
      properties:
        wallet_address:
          type: string
          minLength: 42
          maxLength: 42
          description: 署名に使用するウォレットアドレス
        chain_type:
          type: string
          maxLength: 50
          default: ethereum
          description: ブロックチェーン種別
        network_name:
          type: string
          maxLength: 50
          default: sepolia
          description: ブロックチェーンのネットワーク名

    WalletVerifyRequest:
      type: object
      required: [wallet_address, signature, chain_type, network_name, token_symbol, chain_id]
      properties:
        wallet_address:
          type: string
          minLength: 42
          maxLength: 42
          description: nonce発行時と同じウォレットアドレス
        signature:
          type: string
          minLength: 1
          description: 発行されたnonceをEIP-191形式で署名した値
        chain_type:
          type: string
          minLength: 1
          maxLength: 50
          description: ブロックチェーン種別
        network_name:
          type: string
          minLength: 1
          maxLength: 50
          description: ブロックチェーンのネットワーク名
        token_symbol:
          type: string
          minLength: 1
          maxLength: 20
          description: トークンシンボル
        chain_id:
          type: integer
          minimum: 1
          description: チェーンID

    StoreWallet:
      type: object
      required:
        - wallet_id
        - wallet_address
        - chain_type
        - network_name
        - token_symbol
        - chain_id
        - is_active
        - is_permitted
        - verified_at
        - created_at
        - updated_at
      properties:
        wallet_id:
          type: integer
          description: ウォレットID
        wallet_address:
          type: string
          description: ウォレットアドレス
        chain_type:
          type: string
          description: ブロックチェーン種別
        network_name:
          type: string
          description: ネットワーク名
        token_symbol:
          type: string
          description: トークンシンボル
        chain_id:
          type: integer
          description: チェーンID
        is_active:
          type: boolean
          description: ウォレットが有効か
        is_permitted:
          type: boolean
          description: permit許可済みか
        verified_at:
          type: string
          nullable: true
          description: ウォレット認証日時（YYYY-MM-DD HH:mm）
        created_at:
          type: string
          description: 作成日時（YYYY-MM-DD HH:mm）
        updated_at:
          type: string
          description: 更新日時（YYYY-MM-DD HH:mm）

    WalletNonceCreate:
      type: object
      required: [nonce, expires_at]
      properties:
        nonce:
          type: string
          description: ウォレット署名に使用するnonce
        expires_at:
          type: string
          description: nonce有効期限（YYYY-MM-DD HH:mm）

    StoreWalletVerify:
      type: object
      required:
        - wallet_address
        - chain_type
        - network_name
        - token_symbol
        - chain_id
        - is_active
        - is_permitted
        - verified_at
      properties:
        wallet_address:
          type: string
        chain_type:
          type: string
        network_name:
          type: string
        token_symbol:
          type: string
        chain_id:
          type: integer
        is_active:
          type: boolean
        is_permitted:
          type: boolean
        verified_at:
          type: string
          description: ウォレット認証日時（YYYY-MM-DD HH:mm）

    StoreManagerLoginWrappedResponse:
      type: object
      required: [status, data]
      properties:
        status:
          type: string
          enum: [success]
        data:
          $ref: '#/components/schemas/StoreManagerLogin'

    GetWalletWrappedResponse:
      type: object
      required: [status, data]
      properties:
        status:
          type: string
          enum: [success]
        data:
          allOf:
            - $ref: '#/components/schemas/StoreWallet'
          nullable: true

    WalletNonceCreateWrappedResponse:
      type: object
      required: [status, data]
      properties:
        status:
          type: string
          enum: [success]
        data:
          $ref: '#/components/schemas/WalletNonceCreate'

    StoreWalletVerifyWrappedResponse:
      type: object
      required: [status, data]
      properties:
        status:
          type: string
          enum: [success]
        data:
          $ref: '#/components/schemas/StoreWalletVerify'

    DeleteWalletWrappedResponse:
      type: object
      required: [status, data]
      properties:
        status:
          type: string
          enum: [success]
        data:
          type: object
          nullable: true
          description: 常にnull

    ErrorDetail:
      type: object
      required: [status, message]
      properties:
        status:
          type: string
          enum: [error]
        message:
          type: string
          description: エラーメッセージ

    ErrorResponse:
      type: object
      required: [detail]
      properties:
        detail:
          $ref: '#/components/schemas/ErrorDetail'

    ValidationErrorItem:
      type: object
      required: [loc, msg, type]
      properties:
        loc:
          type: array
          items:
            oneOf:
              - type: string
              - type: integer
        msg:
          type: string
        type:
          type: string

    ValidationErrorResponse:
      type: object
      required: [detail]
      properties:
        detail:
          type: array
          items:
            $ref: '#/components/schemas/ValidationErrorItem'
