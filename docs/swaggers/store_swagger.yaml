openapi: 3.0.3
info:
  title: Teraid Pay Store API
  version: 1.3.0
  description: 店舗管理者のログイン、店舗ウォレットおよびメニュー管理APIのOpenAPI定義。
servers:
  - url: http://localhost:8005
    description: Dockerローカル開発環境

tags:
  - name: StoreManager
    description: 店舗管理者認証
  - name: StoreDevice
    description: 店舗デバイス管理
  - name: StoreWallet
    description: 店舗ウォレット管理
  - name: StoreMenu
    description: 店舗メニュー管理
  - name: StoreOrder
    description: 店舗の注文管理

paths:
  /store/devices:
    get:
      tags: [StoreDevice]
      summary: デバイス一覧取得
      description: 認証済み店舗管理者の店舗に紐づく未削除デバイスを検索条件とページ指定に従って取得する。
      operationId: getDevices
      security:
        - BearerAuth: []
      parameters:
        - name: device_name
          in: query
          required: false
          description: デバイス名の部分一致条件。ワイルドカード文字は通常文字として扱う。
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - name: is_active
          in: query
          required: false
          description: 利用可能状態の完全一致条件。
          schema:
            type: boolean
        - name: page
          in: query
          required: false
          description: 取得するページ番号。
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          required: false
          description: 1ページあたりの取得件数。
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: デバイス一覧取得成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceListWrappedResponse'
              example:
                status: success
                data:
                  devices:
                    - device_id: 1
                      device_name: レジ端末1
                      is_active: false
                      created_at: '2026-11-16T10:00:00+09:00'
                  pagination:
                    page: 1
                    page_size: 20
                    total: 1
                    total_pages: 1
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'
    post:
      tags: [StoreDevice]
      summary: デバイス登録
      description: 認証済み店舗管理者の店舗へ未有効化デバイスを登録する。有効化コードは端末設定時に専用APIで発行する。
      operationId: createDevice
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceCreateRequest'
            example:
              device_name: レジ端末1
      responses:
        '201':
          description: デバイス登録成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceCreateWrappedResponse'
              example:
                status: success
                data:
                  device_id: 1
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'

  /store/devices/{device_id}:
    get:
      tags: [StoreDevice]
      summary: デバイス詳細情報取得
      description: 認証済み店舗管理者の店舗に属する未削除デバイスの管理画面向け詳細情報を取得する。認証情報やUUIDは返さない。
      operationId: getDeviceDetail
      security:
        - BearerAuth: []
      parameters:
        - name: device_id
          in: path
          required: true
          description: 取得対象のデバイスID
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: デバイス詳細情報取得成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceDetailWrappedResponse'
              example:
                status: success
                data:
                  device_id: 1
                  device_name: レジ端末1
                  is_active: false
                  activated_at: null
                  last_authenticated_at: null
                  created_at: '2026-11-16T10:00:00+09:00'
                  updated_at: '2026-11-16T10:00:00+09:00'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: デバイスが存在しない、論理削除済み、または別店舗に所属
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                detail:
                  status: error
                  message: デバイスが存在しません。
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'
    put:
      tags: [StoreDevice]
      summary: デバイス更新
      description: 認証済み店舗管理者の店舗に属する未削除デバイスの名称または利用状態を更新する。未有効化デバイスを直接有効にはできない。
      operationId: updateDevice
      security:
        - BearerAuth: []
      parameters:
        - name: device_id
          in: path
          required: true
          description: 更新対象のデバイスID
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeviceUpdateRequest'
            example:
              device_name: 1階レジ端末
              is_active: false
      responses:
        '200':
          description: デバイス更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceUpdateWrappedResponse'
              example:
                status: success
                data:
                  device_id: 1
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: デバイスが存在しない、論理削除済み、または別店舗に所属
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                detail:
                  status: error
                  message: デバイスが存在しません。
        '422':
          description: リクエスト形式またはデバイスの有効化状態が不正
          content:
            application/json:
              schema:
                oneOf:
                  - $ref: '#/components/schemas/ValidationErrorResponse'
                  - $ref: '#/components/schemas/ErrorResponse'
        '500':
          $ref: '#/components/responses/ServerError'

    delete:
      tags: [StoreDevice]
      summary: デバイス削除
      description: 認証済み店舗管理者の店舗に属する未削除デバイスを論理削除する。削除済みまたは別店舗のデバイスは対象にしない。
      operationId: deleteDevice
      security:
        - BearerAuth: []
      parameters:
        - name: device_id
          in: path
          required: true
          description: 削除対象のデバイスID
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: デバイス削除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceDeleteWrappedResponse'
              example:
                status: success
                data:
                  device_id: 1
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: デバイスが存在しない、論理削除済み、または別店舗に所属
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                detail:
                  status: error
                  message: デバイスが存在しません。
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'

  /store/devices/{device_id}/activation-code:
    post:
      tags: [StoreDevice]
      summary: デバイス有効化コード発行
      description: 未有効化デバイスへ新しい有効化コードを発行する。再発行時は旧コードを即時無効化し、平文コードはこのレスポンスでのみ返す。
      operationId: issueDeviceActivationCode
      security:
        - BearerAuth: []
      parameters:
        - name: device_id
          in: path
          required: true
          description: 有効化コードを発行するデバイスID
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: 有効化コード発行または再発行成功
          headers:
            Cache-Control:
              description: 平文コードを含むレスポンスのキャッシュ禁止
              schema:
                type: string
                example: no-store
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeviceActivationCodeWrappedResponse'
              example:
                status: success
                data:
                  device_id: 1
                  activation_code: ABCD-EFGH-JKLM
                  qr_code_image: data:image/png;base64,iVBORw0KGgoAAA...
                  activation_expires_at: '2026-11-18T10:00:00+09:00'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: デバイスが存在しない、論理削除済み、または別店舗に所属
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: デバイスが既に有効化済み
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'

  /store/manager/login:
    post:
      tags: [StoreManager]
      summary: 店舗管理者ログイン
      description: メールアドレスとパスワードを検証し、店舗管理者用JWTを発行する。
      operationId: loginStoreManager
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StoreManagerLoginRequest'
            example:
              email: api-manager@example.com
              password: password123
      responses:
        '200':
          description: ログイン成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreManagerLoginWrappedResponse'
              example:
                status: success
                data:
                  access_token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                  token_type: Bearer
                  expires_in: 3600
                  store_manager:
                    store_manager_id: 9001
                    store_id: 9001
                    name: API Demo Store Manager
                    roll_id: 1
        '401':
          $ref: '#/components/responses/LoginUnauthorized'
        '403':
          $ref: '#/components/responses/ManagerInactive'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'

  /store/manager/logout:
    post:
      tags: [StoreManager]
      summary: 店舗管理者ログアウト
      description: Bearer認証に使用したJWTを失効させる。
      operationId: logoutStoreManager
      security:
        - BearerAuth: []
      responses:
        '204':
          description: 失効登録が完了した。レスポンス本文はない。
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

  /store/menu/categories:
    get:
      tags: [StoreMenu]
      summary: メニューカテゴリー取得
      description: JWTで認証した店舗管理者のstore_idに紐づく未削除カテゴリーを、検索条件とページ指定に従い画像の署名付きURLとともに取得する。
      operationId: getMenuCategories
      security:
        - BearerAuth: []
      parameters:
        - name: name
          in: query
          required: false
          description: カテゴリー名の部分一致検索。ワイルドカード文字は通常文字として扱う。
          schema:
            type: string
            minLength: 1
            maxLength: 100
        - name: is_active
          in: query
          required: false
          description: 有効状態による完全一致検索。未指定時は有効カテゴリーを取得する。
          schema:
            type: boolean
            default: true
        - name: page
          in: query
          required: false
          description: ページ番号。1から開始する。
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          required: false
          description: 1ページあたりの取得件数。未指定時はページングせず全カテゴリーを取得する。
          schema:
            type: integer
            minimum: 1
            maximum: 100
      responses:
        '200':
          description: カテゴリー取得成功。該当するカテゴリーがない場合は空配列を返す。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuCategoryListWrappedResponse'
              example:
                status: success
                data:
                  menu_categories:
                    - menu_category_id: 9001
                      name: API Demo Category
                      image_url: https://example.com/categories/9001/9001.png?signature=...
                      display_order: 1
                      is_active: true
                  pagination:
                    page: 1
                    page_size: null
                    total: 1
                    total_pages: 1
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'

    post:
      tags: [StoreMenu]
      summary: メニューカテゴリー登録
      description: JWTで認証した店舗へ、画像付きメニューカテゴリーを登録する。画像はDB登録後にS3のcategory_image_bucketへ保存する。
      operationId: createMenuCategory
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MenuCategoryCreateRequest'
            example:
              name: ハンバーガー
              category_image: iVBORw0KGgoAAAANSUhEUgAAAAEAAAAB...
              image_extension: png
              display_order: 1
              is_active: true
      responses:
        '201':
          description: カテゴリー登録成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuCategoryCreateWrappedResponse'
              example:
                status: success
                data:
                  menu_category_id: 1
                  name: ハンバーガー
                  display_order: 1
                  is_active: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/MenuCategoryValidationError'
        '500':
          $ref: '#/components/responses/ServerError'

  /store/menu/categories/{menu_category_id}:
    get:
      tags: [StoreMenu]
      summary: メニューカテゴリー詳細取得
      description: JWTで認証した店舗管理者のstore_idに紐づく未削除カテゴリーを、画像の署名付きURLとともに取得する。無効カテゴリーも取得対象とする。
      operationId: getMenuCategoryDetail
      security:
        - BearerAuth: []
      parameters:
        - name: menu_category_id
          in: path
          required: true
          description: 取得対象のメニューカテゴリーID。
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: カテゴリー詳細取得成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuCategoryWrappedResponse'
              example:
                status: success
                data:
                  menu_category_id: 1
                  name: ハンバーガー
                  image_url: https://example.com/categories/101/1.png?signature=...
                  display_order: 1
                  is_active: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/MenuCategoryDetailNotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'

    put:
      tags: [StoreMenu]
      summary: メニューカテゴリー更新
      description: JWTで認証した店舗管理者のstore_idに紐づく未削除カテゴリーを更新する。画像を変更する場合だけcategory_imageとimage_extensionを指定する。
      operationId: updateMenuCategory
      security:
        - BearerAuth: []
      parameters:
        - name: menu_category_id
          in: path
          required: true
          description: 更新対象のメニューカテゴリーID。
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MenuCategoryUpdateRequest'
            example:
              name: ハンバーガー・サンドイッチ
              category_image: iVBORw0KGgoAAAANSUhEUgAAAAEAAAAB...
              image_extension: png
              display_order: 2
              is_active: true
      responses:
        '200':
          description: カテゴリー更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuCategoryUpdateWrappedResponse'
              example:
                status: success
                data:
                  menu_category_id: 1
                  name: ハンバーガー・サンドイッチ
                  display_order: 2
                  is_active: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/MenuCategoryDetailNotFound'
        '422':
          $ref: '#/components/responses/MenuCategoryValidationError'
        '500':
          $ref: '#/components/responses/ServerError'

    delete:
      tags: [StoreMenu]
      summary: メニューカテゴリー削除
      description: 認証済み店舗管理者の店舗に属する未削除カテゴリーを論理削除する。無効カテゴリーも対象とし、商品との紐づけとカテゴリー画像を保持する。
      operationId: deleteMenuCategory
      security:
        - BearerAuth: []
      parameters:
        - name: menu_category_id
          in: path
          required: true
          description: 削除対象のメニューカテゴリーID。
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: カテゴリー削除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuCategoryDeleteWrappedResponse'
              example:
                status: success
                data:
                  menu_category_id: 1
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/MenuCategoryDetailNotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'

  /store/orders:
    get:
      tags: [StoreOrder]
      summary: オーダー一覧取得
      description: 認証済み管理者の所属店舗の注文を、未提供または提供済みに絞って明細付きで返す。未提供は受付日時・注文IDの昇順、提供済みは提供完了日時・注文IDの降順。
      operationId: getOrders
      security:
        - BearerAuth: []
      parameters:
        - name: fulfillment_status
          in: query
          required: true
          description: unserved は未提供かつ未取消の注文、served は提供済みの注文。
          schema:
            type: string
            enum: [unserved, served]
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: オーダー一覧取得成功。注文がない場合は orders に空配列を返す。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrderListWrappedResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'

  /store/menu:
    get:
      tags: [StoreMenu]
      summary: メニュー一覧取得
      description: JWTで認証した店舗管理者のstore_idに紐づく、未削除のメニュー商品を表示順で取得する。商品画像は署名付きURLで返す。
      operationId: getMenus
      security:
        - BearerAuth: []
      parameters:
        - name: name
          in: query
          required: false
          description: 商品名の部分一致検索。大文字・小文字を区別しない。
          schema:
            type: string
            minLength: 1
            maxLength: 255
        - name: menu_category_id
          in: query
          required: false
          description: メニューカテゴリーIDによる完全一致検索。
          schema:
            type: integer
            minimum: 1
        - name: is_available
          in: query
          required: false
          description: 公開状態による完全一致検索。trueは販売中、falseは非公開。
          schema:
            type: boolean
        - name: page
          in: query
          required: false
          description: ページ番号。1から開始する。
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: page_size
          in: query
          required: false
          description: 1ページあたりの取得件数。
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: メニュー一覧取得成功。該当する商品がない場合は空配列を返す。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuListWrappedResponse'
              example:
                status: success
                data:
                  menu_items:
                    - menu_item_id: 10
                      menu_category_id: 1
                      menu_category_name: ハンバーガー
                      name: チーズバーガー
                      description: チェダーチーズ入り
                      price: '800.000000'
                      token_symbol: JPYC
                      image_url: https://example.com/menus/101/10.jpeg?signature=...
                      is_available: true
                      display_order: 1
                  pagination:
                    page: 1
                    page_size: 20
                    total: 1
                    total_pages: 1
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

    post:
      tags: [StoreMenu]
      summary: メニュー登録
      description: JWTで認証した店舗へ、商品、オプショングループ、オプションおよび商品画像を登録する。画像は全DBデータ登録後にS3へ保存する。
      operationId: createMenu
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MenuCreateRequest'
            example:
              menu_category_id: 9001
              name: チーズバーガー
              description: チェダーチーズ入り
              price: '800.000000'
              token_symbol: JPYC
              menu_image: iVBORw0KGgoAAAANSUhEUgAAAAEAAAAB...
              image_extension: png
              is_available: true
              display_order: 1
              option_groups:
                - name: サイズ
                  min_selections: 1
                  max_selections: 1
                  display_order: 1
                  is_active: true
                  options:
                    - name: 通常
                      additional_price: '0.000000'
                      display_order: 1
                      is_available: true
                    - name: 大盛り
                      additional_price: '100.000000'
                      display_order: 2
                      is_available: true
      responses:
        '201':
          description: メニュー登録成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuCreateWrappedResponse'
              example:
                status: success
                data:
                  menu_item_id: 10
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/MenuCategoryNotFound'
        '422':
          $ref: '#/components/responses/MenuValidationError'
        '500':
          $ref: '#/components/responses/ServerError'

  /store/menu/{menu_item_id}:
    get:
      tags: [StoreMenu]
      summary: メニュー詳細取得
      description: JWTで認証した店舗管理者のstore_idと商品IDに一致する、未削除の商品、カテゴリー、オプショングループ、オプションを取得する。商品画像は署名付きURLで返す。
      operationId: getMenuDetail
      security:
        - BearerAuth: []
      parameters:
        - name: menu_item_id
          in: path
          required: true
          description: 取得対象のメニュー商品ID
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: メニュー詳細取得成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuDetailWrappedResponse'
              example:
                status: success
                data:
                  menu_item_id: 10
                  menu_category_id: 1
                  menu_category_name: ハンバーガー
                  name: チーズバーガー
                  description: チェダーチーズ入り
                  price: '800.000000'
                  token_symbol: JPYC
                  image_url: https://example.com/menus/101/10.jpeg?signature=...
                  is_available: true
                  display_order: 1
                  option_groups:
                    - menu_option_group_id: 20
                      name: サイズ
                      min_selections: 1
                      max_selections: 1
                      display_order: 1
                      is_active: true
                      options:
                        - menu_option_id: 30
                          name: 大盛り
                          additional_price: '100.000000'
                          display_order: 1
                          is_available: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/MenuItemNotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'

    put:
      tags: [StoreMenu]
      summary: メニュー基本情報更新
      description: JWTで認証した店舗管理者のstore_idと商品IDに一致する商品の基本情報と任意の画像を更新する。オプショングループとオプションは更新しない。
      operationId: updateMenu
      security:
        - BearerAuth: []
      parameters:
        - name: menu_item_id
          in: path
          required: true
          description: 更新対象のメニュー商品ID
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MenuUpdateRequest'
            example:
              menu_category_id: 1
              name: ダブルチーズバーガー
              description: チーズを2枚に変更
              price: '950.000000'
              token_symbol: JPYC
              menu_image: iVBORw0KGgoAAAANSUhEUgAAAAEAAAAB...
              image_extension: png
              is_available: true
              display_order: 1
      responses:
        '200':
          description: メニュー基本情報更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuUpdateWrappedResponse'
              example:
                status: success
                data:
                  menu_item_id: 10
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/MenuUpdateNotFound'
        '422':
          $ref: '#/components/responses/MenuValidationError'
        '500':
          $ref: '#/components/responses/ServerError'

    delete:
      tags: [StoreMenu]
      summary: メニュー削除
      description: 認証済み店舗管理者の店舗に属する商品と配下のオプション構成を論理削除する。販売停止中の商品も対象とし、商品画像は保持する。
      operationId: deleteMenu
      security:
        - BearerAuth: []
      parameters:
        - name: menu_item_id
          in: path
          required: true
          description: 削除対象のメニュー商品ID
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: メニュー削除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuDeleteWrappedResponse'
              example:
                status: success
                data:
                  menu_item_id: 10
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/MenuItemNotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'

  /store/menu/{menu_item_id}/option-groups:
    put:
      tags: [StoreMenu]
      summary: メニューオプション構成更新
      description: JWTで認証した店舗管理者の商品について、オプショングループとオプションをリクエストの完全な構成へ同期する。
      operationId: updateMenuOptionGroups
      security:
        - BearerAuth: []
      parameters:
        - name: menu_item_id
          in: path
          required: true
          description: 更新対象のメニュー商品ID
          schema:
            type: integer
            minimum: 1
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MenuOptionGroupsUpdateRequest'
            example:
              option_groups:
                - menu_option_group_id: 20
                  name: サイズ
                  min_selections: 1
                  max_selections: 1
                  display_order: 1
                  is_active: true
                  options:
                    - menu_option_id: 30
                      name: 通常
                      additional_price: '0.000000'
                      display_order: 1
                      is_available: true
                    - name: 特大
                      additional_price: '200.000000'
                      display_order: 2
                      is_available: true
      responses:
        '200':
          description: メニューオプション構成更新成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MenuOptionGroupsUpdateWrappedResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/MenuItemNotFound'
        '422':
          $ref: '#/components/responses/MenuValidationError'
        '500':
          $ref: '#/components/responses/ServerError'

  /store/wallet:
    get:
      tags: [StoreWallet]
      summary: 店舗ウォレット取得
      description: JWTで認証した店舗管理者のstore_idを使用して店舗ウォレットを取得する。
      operationId: getStoreWallet
      security:
        - BearerAuth: []
      responses:
        '200':
          description: 取得成功。ウォレット未登録の場合はdataがnullになる。
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/GetWalletWrappedResponse'
              examples:
                found:
                  summary: ウォレット登録済み
                  value:
                    status: success
                    data:
                      wallet_id: 9001
                      wallet_address: '0x9001000000000000000000000000000000000001'
                      chain_type: ethereum
                      network_name: sepolia
                      token_symbol: JPYC
                      chain_id: 11155111
                      is_active: true
                      is_permitted: true
                      verified_at: '2026-11-14 12:00'
                      created_at: '2026-11-14 12:00'
                      updated_at: '2026-11-14 12:00'
                notRegistered:
                  summary: ウォレット未登録
                  value:
                    status: success
                    data: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/ServerError'

    post:
      tags: [StoreWallet]
      summary: 店舗ウォレット認証・登録
      description: 発行済みnonceの署名を検証し、JWTで認証した店舗へウォレットを登録する。
      operationId: verifyAndCreateStoreWallet
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WalletVerifyRequest'
            example:
              wallet_address: '0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266'
              signature: '0x署名値'
              chain_type: ethereum
              network_name: sepolia
              token_symbol: JPYC
              chain_id: 11155111
      responses:
        '200':
          description: ウォレット登録成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/StoreWalletVerifyWrappedResponse'
        '401':
          description: JWTまたはウォレット署名の認証失敗
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: JWTに紐づく店舗が存在しない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 対象店舗に同一チェーンのウォレットが登録済み
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'

  /store/wallet/nonce:
    post:
      tags: [StoreWallet]
      summary: ウォレット認証用nonce発行
      description: JWTで認証した店舗向けに、ウォレット署名で使用するnonceを発行する。
      operationId: createStoreWalletNonce
      security:
        - BearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WalletNonceCreateRequest'
            example:
              wallet_address: '0xf39Fd6e51aad88F6F4ce6aB8827279cffFb92266'
              chain_type: ethereum
              network_name: sepolia
      responses:
        '200':
          description: nonce発行成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WalletNonceCreateWrappedResponse'
              example:
                status: success
                data:
                  nonce: generated-nonce
                  expires_at: '2026-11-14 12:10'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: 店舗が存在しない、またはウォレットアドレスが使用済み
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'

  /store/wallet/{wallet_id}:
    delete:
      tags: [StoreWallet]
      summary: 店舗ウォレット削除
      description: JWTで認証した店舗に紐づくウォレットを論理削除する。
      operationId: deleteStoreWallet
      security:
        - BearerAuth: []
      parameters:
        - name: wallet_id
          in: path
          required: true
          description: 削除対象のウォレットID
          schema:
            type: integer
          example: 9001
      responses:
        '200':
          description: ウォレット削除成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteWalletWrappedResponse'
              example:
                status: success
                data: null
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          description: 認証店舗に紐づくウォレットが存在しない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          $ref: '#/components/responses/ValidationError'
        '500':
          $ref: '#/components/responses/ServerError'

components:
  securitySchemes:
    BearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: 店舗管理者ログインAPIで発行されたJWT。

  responses:
    LoginUnauthorized:
      description: メールアドレスまたはパスワードが不正
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ManagerInactive:
      description: 店舗管理者アカウントが利用不可
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: JWTが未指定、不正、期限切れ、失効済み、または店舗管理者を認証できない
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ValidationError:
      description: リクエスト形式不正
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ValidationErrorResponse'
    MenuCategoryNotFound:
      description: 指定したカテゴリーが認証店舗に存在しない、無効、または削除済み
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            detail:
              status: error
              message: メニューカテゴリーが存在しません。
    MenuCategoryDetailNotFound:
      description: 指定したカテゴリーが認証店舗に存在しない、別店舗に属する、または削除済み
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            detail:
              status: error
              message: メニューカテゴリーが存在しません。
    MenuItemNotFound:
      description: 指定した商品が認証店舗に存在しない、別店舗に属する、または削除済み
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
          example:
            detail:
              status: error
              message: メニュー商品が存在しません。
    MenuUpdateNotFound:
      description: 指定した商品またはカテゴリーが認証店舗に存在しない、別店舗に属する、削除済み、もしくはカテゴリーが無効
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    MenuValidationError:
      description: リクエスト形式、画像データ、または画像拡張子が不正
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/ValidationErrorResponse'
              - $ref: '#/components/schemas/ErrorResponse'
    MenuCategoryValidationError:
      description: リクエスト形式、カテゴリー画像データ、または画像拡張子が不正
      content:
        application/json:
          schema:
            oneOf:
              - $ref: '#/components/schemas/ValidationErrorResponse'
              - $ref: '#/components/schemas/ErrorResponse'
    ServerError:
      description: サーバーエラー
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'

  schemas:
    DeviceActivationCode:
      type: object
      additionalProperties: false
      required: [device_id, activation_code, qr_code_image, activation_expires_at]
      properties:
        device_id:
          type: integer
          minimum: 1
        activation_code:
          type: string
          description: 発行時に一度だけ返す平文の有効化コード
          example: ABCD-EFGH-JKLM
        qr_code_image:
          type: string
          description: 有効化情報を格納したBase64形式のPNG data URL。API URLは含まない
          example: data:image/png;base64,iVBORw0KGgoAAA...
        activation_expires_at:
          type: string
          format: date-time

    DeviceActivationCodeWrappedResponse:
      type: object
      required: [status, data]
      properties:
        status:
          type: string
          enum: [success]
        data:
          $ref: '#/components/schemas/DeviceActivationCode'

    DeviceUpdateRequest:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        device_name:
          type: string
          minLength: 1
          maxLength: 100
          description: 更新後のデバイス名
        is_active:
          type: boolean
          description: 更新後の利用可能状態

    DeviceUpdate:
      type: object
      additionalProperties: false
      required: [device_id]
      properties:
        device_id:
          type: integer
          minimum: 1

    DeviceUpdateWrappedResponse:
      type: object
      required: [status, data]
      properties:
        status:
          type: string
          enum: [success]
        data:
          $ref: '#/components/schemas/DeviceUpdate'

    DeviceDelete:
      type: object
      additionalProperties: false
      required: [device_id]
      properties:
        device_id:
          type: integer
          minimum: 1

    DeviceDeleteWrappedResponse:
      type: object
      required: [status, data]
      properties:
        status:
          type: string
          enum: [success]
        data:
          $ref: '#/components/schemas/DeviceDelete'

    DeviceDetail:
      type: object
      additionalProperties: false
      required:
        - device_id
        - device_name
        - is_active
        - activated_at
        - last_authenticated_at
        - created_at
        - updated_at
      properties:
        device_id:
          type: integer
          minimum: 1
        device_name:
          type: string
        is_active:
          type: boolean
        activated_at:
          type: string
          format: date-time
          nullable: true
        last_authenticated_at:
          type: string
          format: date-time
          nullable: true
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    DeviceDetailWrappedResponse:
      type: object
      required: [status, data]
      properties:
        status:
          type: string
          enum: [success]
        data:
          $ref: '#/components/schemas/DeviceDetail'

    OrderListWrappedResponse:
      type: object
      required: [status, data]
      properties:
        status:
          type: string
          enum: [success]
        data:
          type: object
          required: [orders, pagination]
          properties:
            orders:
              type: array
              items:
                $ref: '#/components/schemas/OrderListEntry'
            pagination:
              $ref: '#/components/schemas/DevicePagination'

    OrderListEntry:
      type: object
      required: [menu_order_id, visit_session_id, device_name, status, created_at, served_at, items]
      properties:
        menu_order_id:
          type: integer
          format: int64
        visit_session_id:
          type: integer
          format: int64
          nullable: true
        device_name:
          type: string
          nullable: true
          description: 注文元端末の名称。端末を特定できない場合は null。
        status:
          type: integer
          enum: [1, 2, 3, 4, 5]
          description: 1 は支払い待ち、2 は決済処理中、3 は支払済み、4 は決済失敗、5 はキャンセル。
        served_at:
          type: string
          format: date-time
          nullable: true
          description: 提供完了日時。未提供の場合は null。
        created_at:
          type: string
          format: date-time
          description: 注文受付日時（日本時間）。
        items:
          type: array
          items:
            type: object
            required: [menu_item_name, quantity, options]
            properties:
              menu_item_name:
                type: string
                description: 注文時の商品名。
              quantity:
                type: integer
                minimum: 1
              options:
                type: array
                items:
                  type: object
                  required: [option_group_name, option_name, option_quantity]
                  properties:
                    option_group_name:
                      type: string
                    option_name:
                      type: string
                    option_quantity:
                      type: integer
                      minimum: 1
                      description: 商品1個当たりのオプション数量。

    DeviceListItem:
      type: object
      additionalProperties: false
      required: [device_id, device_name, is_active, created_at]
      properties:
        device_id:
          type: integer
          minimum: 1
        device_name:
          type: string
        is_active:
          type: boolean
        created_at:
          type: string
          format: date-time

    DevicePagination:
      type: object
      additionalProperties: false
      required: [page, page_size, total, total_pages]
      properties:
        page:
          type: integer
          minimum: 1
        page_size:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
        total_pages:
          type: integer
          minimum: 0

    DeviceList:
      type: object
      additionalProperties: false
      required: [devices, pagination]
      properties:
        devices:
          type: array
          items:
            $ref: '#/components/schemas/DeviceListItem'
        pagination:
          $ref: '#/components/schemas/DevicePagination'

    DeviceListWrappedResponse:
      type: object
      required: [status, data]
      properties:
        status:
          type: string
          enum: [success]
        data:
          $ref: '#/components/schemas/DeviceList'

    DeviceCreateRequest:
      type: object
      additionalProperties: false
      required: [device_name]
      properties:
        device_name:
          type: string
          minLength: 1
          maxLength: 100
          description: 店舗管理者が設定するデバイス名

    DeviceCreate:
      type: object
      required: [device_id]
      properties:
        device_id:
          type: integer
          minimum: 1

    DeviceCreateWrappedResponse:
      type: object
      required: [status, data]
      properties:
        status:
          type: string
          enum: [success]
        data:
          $ref: '#/components/schemas/DeviceCreate'

    StoreManagerLoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          minLength: 3
          maxLength: 255
          description: 店舗管理者のメールアドレス
          example: api-manager@example.com
        password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
          description: 店舗管理者のパスワード
          example: password123

    MenuCategory:
      type: object
      required: [menu_category_id, name, image_url, display_order, is_active]
      properties:
        menu_category_id:
          type: integer
          minimum: 1
          description: メニューカテゴリーID
        name:
          type: string
          description: メニューカテゴリー名
        image_url:
          type: string
          format: uri
          description: カテゴリー画像を取得する有効期限付き署名付きURL
        display_order:
          type: integer
          minimum: 0
          description: 表示順
        is_active:
          type: boolean
          description: 有効フラグ

    MenuCategoryList:
      type: object
      required: [menu_categories, pagination]
      properties:
        menu_categories:
          type: array
          description: 認証店舗の検索条件に一致するメニューカテゴリー一覧
          items:
            $ref: '#/components/schemas/MenuCategory'
        pagination:
          $ref: '#/components/schemas/MenuCategoryPagination'

    MenuCategoryPagination:
      type: object
      required: [page, page_size, total, total_pages]
      properties:
        page:
          type: integer
          minimum: 1
          description: 現在のページ番号。全件取得時は1。
        page_size:
          type: integer
          minimum: 1
          maximum: 100
          nullable: true
