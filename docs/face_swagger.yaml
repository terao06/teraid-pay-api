openapi: 3.0.3
info:
  title: Teraid Pay API
  version: 1.0.0
  description: 顔認証 API の Swagger 定義。
servers:
  - url: http://localhost:8005
    description: ローカル開発環境

tags:
  - name: Face
    description: 顔認証操作

paths:
  /face/{user_id}:
    get:
      tags:
        - Face
      summary: 顔登録状況取得
      description: 指定ユーザーが顔画像を登録済みか確認する。
      operationId: getFaceRegisterState
      parameters:
        - name: user_id
          in: path
          required: true
          description: ユーザーID
          schema:
            type: integer
            minimum: 1
      responses:
        '200':
          description: 顔登録状況の取得に成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FaceRegisterStatusWrappedResponse'
              examples:
                registered:
                  summary: 登録済み
                  value:
                    status: success
                    data:
                      user_id: 101
                      is_registered: true
                notRegistered:
                  summary: 未登録
                  value:
                    status: success
                    data:
                      user_id: 101
                      is_registered: false
        '404':
          description: ユーザーが存在しない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: バリデーションエラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '500':
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /face/:
    post:
      tags:
        - Face
      summary: 顔画像登録
      description: ユーザーに認証用の顔画像を登録する。入力画像は 112x112 px の顔画像を Base64 エンコードした文字列を指定する。
      operationId: registerFace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FaceRegisterRequest'
            examples:
              default:
                value:
                  user_id: 101
                  content: iVBORw0KGgoAAAANSUhEUgAAAAEAAAAB
                  extension_type: png
      responses:
        '200':
          description: 顔画像登録に成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FaceWrappedResponse'
              examples:
                success:
                  value:
                    status: success
                    data: null
        '400':
          description: 顔を検出できない、複数の顔を検出した、または画像登録に失敗
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: ユーザーが存在しない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 顔画像がすでに登録済み
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: バリデーションエラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '500':
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      tags:
        - Face
      summary: 顔画像更新
      description: ユーザーに登録済みの認証用顔画像を更新する。入力画像は 112x112 px の顔画像を Base64 エンコードした文字列を指定する。
      operationId: updateFace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FaceUpdateRequest'
            examples:
              default:
                value:
                  user_id: 101
                  content: iVBORw0KGgoAAAANSUhEUgAAAAEAAAAB
                  extension_type: png
      responses:
        '200':
          description: 顔画像更新に成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FaceWrappedResponse'
              examples:
                success:
                  value:
                    status: success
                    data: null
        '400':
          description: 顔を検出できない、複数の顔を検出した、または画像登録に失敗
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: ユーザーが存在しない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 顔画像がすでに別ユーザーに登録済み、または更新対象の顔画像が未登録
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: バリデーションエラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '500':
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags:
        - Face
      summary: 顔画像削除
      description: ユーザーに登録済みの認証用顔画像を削除する。
      operationId: deleteFace
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FaceDeleteRequest'
            examples:
              default:
                value:
                  user_id: 101
      responses:
        '200':
          description: 顔画像削除に成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FaceWrappedResponse'
              examples:
                success:
                  value:
                    status: success
                    data: null
        '400':
          description: 削除対象の顔画像が未登録
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: ユーザーが存在しない
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: バリデーションエラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
        '500':
          description: サーバーエラー
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  schemas:
    FaceRegisterRequest:
      type: object
      required:
        - user_id
        - content
        - extension_type
      properties:
        user_id:
          type: integer
          minimum: 1
          description: 登録対象ユーザーID
        content:
          type: string
          format: byte
          description: Base64 エンコードされた登録対象の顔画像。入力画像サイズは 112x112 px
        extension_type:
          type: string
          enum:
            - jpeg
            - png
            - jpg
          description: 画像拡張子

    FaceUpdateRequest:
      type: object
      required:
        - user_id
        - content
        - extension_type
      properties:
        user_id:
          type: integer
          minimum: 1
          description: 登録対象ユーザーID
        content:
          type: string
          format: byte
          maxLength: 6000
          description: Base64 エンコードされた更新対象の顔画像。入力画像サイズは 112x112 px
        extension_type:
          type: string
          enum:
            - jpeg
            - png
            - jpg
          description: 画像拡張子

    FaceDeleteRequest:
      type: object
      required:
        - user_id
      properties:
        user_id:
          type: integer
          minimum: 1
          description: 削除対象ユーザーID

    FaceRegisterStatus:
      type: object
      required:
        - user_id
        - is_registered
      properties:
        user_id:
          type: integer
          minimum: 1
          description: ユーザーID
        is_registered:
          type: boolean
          description: 顔画像が登録済みかどうか

    FaceRegisterStatusWrappedResponse:
      type: object
      required:
        - status
        - data
      properties:
        status:
          type: string
          enum: [success]
        data:
          $ref: '#/components/schemas/FaceRegisterStatus'

    FaceWrappedResponse:
      type: object
      required:
        - status
        - data
      properties:
        status:
          type: string
          enum: [success]
        data:
          nullable: true
          description: 成功時は null

    ErrorDetail:
      type: object
      required:
        - status
        - message
      properties:
        status:
          type: string
          enum: [error]
        message:
          type: string
          description: エラーメッセージ

    ErrorResponse:
      type: object
      required:
        - detail
      properties:
        detail:
          $ref: '#/components/schemas/ErrorDetail'

    ValidationError:
      type: object
      properties:
        loc:
          type: array
          items:
            oneOf:
              - type: string
              - type: integer
        msg:
          type: string
        type:
          type: string

    ValidationErrorResponse:
      type: object
      required:
        - detail
      properties:
        detail:
          type: array
          items:
            $ref: '#/components/schemas/ValidationError'
